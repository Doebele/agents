# Build and deploy.
#
# The pages are built here, not committed. That was a deliberate change after
# two pull requests, each correct on its own branch, merged into a site/ that
# matched neither: the fact-sheet count is derived at build time, and git
# merges text, not derivations. Building after the merge makes that class of
# mistake impossible rather than merely detectable.
#
# build.py validates before it writes — a missing translation, a chip without
# a fact sheet, a fact sheet no chip reaches all stop it. So the build step is
# also the check, and it runs on pull requests too.
#
# The secrets context is available in no if-condition — neither on the job nor
# on the step. So the value moves into env first and the condition reads env.
name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'build/**'
      - 'site/.htaccess'
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.STRATO_FTP_SERVER }}
    steps:
      # Volle Historie, nicht der flache Standard-Klon: build/stand.py leitet
      # aus ihr ab, wann jeder Steckbrief zuletzt inhaltlich anders aussah.
      # Ein flacher Klon kennt die frueheren Commits nicht und wuerde jedem
      # Eintrag ein zu junges Datum geben — deshalb laesst stand.py es dann
      # ganz weg, und ohne diese Zeile stuende auf der Seite kein Datum.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build both language files
        run: python3 build/build.py

      # Strato speaks SFTP on port 22, not FTP on 21 — the host behind the
      # secret reverse-resolves to sshio.rzone.de.
      #
      # And its SSH account has no shell: it is SFTP only. Actions built on
      # scp fail here, because they run mkdir and tar on the far side. lftp
      # speaks the SFTP protocol itself and needs no remote commands.
      #
      # The secret names still say FTP; they carry the SFTP credentials.
      # The password travels through the environment, never on a command line.
      - name: Upload to Strato
        if: github.ref == 'refs/heads/main' && env.FTP_SERVER != ''
        env:
          FTP_HOST: ${{ secrets.STRATO_FTP_SERVER }}
          FTP_USER: ${{ secrets.STRATO_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.STRATO_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER" --env-password "sftp://$FTP_HOST" <<'EOF'
            set sftp:auto-confirm yes
            set net:max-retries 2
            # Strato's sshio sometimes accepts the connection and then stalls
            # silently — without timeouts the job hangs until GitHub's 6-hour
            # limit instead of failing and letting a retry through.
            set net:timeout 30
            set net:idle-timeout 120
            # The SFTP login already lands in the subdomain's document root.
            put -O . site/index.html
            put -O . site/index.de.html
            put -O . site/.htaccess
            cls -l
            bye
          EOF
