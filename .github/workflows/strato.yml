# Two things in one workflow:
#
# 1. On every push it verifies that site/ still matches content/. That catches
#    the most common mistake — content edited, rebuild forgotten.
# 2. If the FTP credentials are present, the pages are then uploaded to
#    agents.medvesek.com. Without them only that step is skipped; the check
#    still runs.
#
# The secrets context is available in no if-condition — neither on the job nor
# on the step. So the value moves into env first and the condition reads env.
name: Check and deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'content/**'
      - 'build/**'
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.STRATO_FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify build is current
        run: python3 build/build.py --check

      # Strato serves SFTP on port 22, not FTP on 21 — the host behind the
      # secret reverse-resolves to sshio.rzone.de. A plain FTP client is
      # refused there, so this uploads over SSH.
      #
      # The secret names still say FTP; they carry the SFTP credentials.
      - name: Upload to Strato
        if: github.ref == 'refs/heads/main' && env.FTP_SERVER != ''
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.STRATO_FTP_SERVER }}
          username: ${{ secrets.STRATO_FTP_USER }}
          password: ${{ secrets.STRATO_FTP_PASSWORD }}
          port: 22
          # strip_components drops the leading site/ so the files land
          # directly in the subdomain's document root.
          #
          # The target is relative: the SSH login lands in the webspace, and
          # an absolute /agents would mean the server root, where the user
          # may not create anything.
          source: "site/index.html,site/index.de.html,site/.htaccess"
          target: "agents"
          strip_components: 1
