# Instructing the agent by hand.
#
# Open an issue or write a comment containing @claude — "add Cursor to block
# 02", "the LM Studio price looks wrong", "Whisper does not belong under
# research". The agent reads it, does the work, and opens a pull request.
#
# This is the input channel. It works from the GitHub app on a phone, which
# is also where the resulting pull request gets reviewed and merged. No bot,
# no token, no second service that can go down.
#
# Who pays is the repository variable CLAUDE_ZUGANG: api (the Console balance,
# the default) or abo (the Claude subscription). @claude-api and @claude-abo
# override it for that one order; plain @claude follows the variable.
name: Claude on request

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Only on mention, and only from the repository owner — otherwise anyone
    # who can comment could spend the API key.
    if: |
      github.event.sender.login == github.repository_owner &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    steps:
      # First, before anything can fail: the failure report at the end is an
      # action from this repository and cannot start without a checkout. The
      # key check below is exactly where an empty API balance shows up.
      - uses: actions/checkout@v5

      # @claude-abo and @claude-api choose the pot for this order alone. The
      # action looks for its trigger phrase followed by a space or punctuation,
      # so "@claude" does not answer to "@claude-abo" — the phrase that was
      # actually written is handed on as the trigger.
      - name: Which pot was called
        id: ruf
        env:
          TEXT: ${{ github.event.comment.body || format('{0} {1}', github.event.issue.title, github.event.issue.body) }}
        run: |
          set -uo pipefail
          # One word per line, so that two mentions a single space apart
          # are both seen.
          WAHL=$(printf '%s\n' "$TEXT" | tr -s '[:space:]' '\n' \
                 | grep -iE '^@claude-(abo|api)([.,!?;:].*)?$' \
                 | cut -c9-11 | tr 'A-Z' 'a-z' | sort -u)
          if [ "$(printf '%s' "$WAHL" | grep -c .)" -gt 1 ]; then
            echo "Both @claude-abo and @claude-api in one order; which pot is meant is unclear." \
              | tee "$RUNNER_TEMP/fehlergrund.txt"
            exit 1
          fi
          echo "wahl=$WAHL" >> "$GITHUB_OUTPUT"
          echo "ausloeser=@claude${WAHL:+-$WAHL}" >> "$GITHUB_OUTPUT"
          echo "Called as @claude${WAHL:+-$WAHL}"

      - name: Choose and check the access
        id: zugang
        uses: ./.github/actions/claude-zugang
        with:
          wahl: ${{ steps.ruf.outputs.wahl }}
          variable: ${{ vars.CLAUDE_ZUGANG }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          modell: claude-opus-5

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Exactly one of the two, the other stays empty: with both set the
          # API key wins and the subscription never pays.
          anthropic_api_key: ${{ steps.zugang.outputs.zugang == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ steps.zugang.outputs.zugang == 'abo' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          trigger_phrase: ${{ steps.ruf.outputs.ausloeser }}
          # Bash(cmd:*) is the form the action accepts; the earlier narrow
          # list produced permission_denials_count 4 and no answer, so it
          # covers the shell basics as well.
          #
          # A word of warning to whoever reads the history: the instant
          # failures of 20 August looked like a configuration fault and were
          # not one. Two runs on the same commit, one worked and one died in
          # 300 ms — the account had run out of credit in between. The probe
          # step above exists so that never costs an evening again.
          claude_args: |
            --max-turns 150
            --allowedTools "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(python3:*),Bash(git:*),Bash(gh:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(find:*),Bash(mkdir:*),Bash(mv:*),Bash(rm:*),Bash(curl:*)"
          prompt: |
            Read CLAUDE.md before anything else. Its rules bind you —
            especially: never invent a fact or a link, never edit site/ by
            hand, never push to main, one topic per pull request.

            Do what the maintainer asked in the issue or comment that
            triggered you.

            If it involves changing the catalogue: edit content/*.json, then
            run `python3 build/build.py`, which must exit 0. Commit only the
            source change — site/ is not in git, the deploy workflow builds
            it. Open a pull request with the source URL for every claim.

            If the request is unclear, or if doing it would mean guessing at a
            fact, do not guess. Reply in the thread and ask.

      - name: Aufwand erfassen
        if: always()
        uses: ./.github/actions/kosten
        with:
          agent: ${{ steps.zugang.outputs.zugang == 'abo' && 'claude-abo' || 'claude' }}
          execution: ${{ steps.claude.outputs.execution_file }}

      - name: Scheitern im Issue melden
        if: failure() && (github.event.issue.number || github.event.pull_request.number)
        uses: ./.github/actions/fehlermeldung
        with:
          agent: ${{ format('Claude ({0})', steps.zugang.outputs.zugang || 'Zugang unklar') }}
          execution: ${{ steps.claude.outputs.execution_file }}
