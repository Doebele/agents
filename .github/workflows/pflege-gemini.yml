# Weekly upkeep, second opinion.
#
# The same job as pflege.yml, run by a different harness. Thursdays, so the
# two do not collide and you get one proposal from each per week.
#
# For a catalogue *about* AI agents this is not a gimmick. Over a few weeks
# you can read side by side which one researches more carefully and which one
# writes better German. That is data you cannot get from a comparison table.
#
# Both run against the same guard rails: build check, chips against fact
# sheets, pull requests only. Neither can publish.
name: Weekly upkeep (Gemini)

on:
  schedule:
    # Thursdays 06:20 UTC. Claude runs Mondays.
    - cron: "20 6 * * 4"
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional: what to look at this run (leave empty to let it choose)"
        required: false
        type: string
  # The same on-demand channel Claude has, with @gemini instead of @claude.
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  upkeep:
    # Scheduled and dispatched runs pass unconditionally. A mention only
    # counts from the repository owner — otherwise anyone who can comment
    # could spend the key.
    if: |
      (github.event_name != 'issues' && github.event_name != 'issue_comment') ||
      (github.event.sender.login == github.repository_owner &&
       (
         (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini')) ||
         (github.event_name == 'issues' && (contains(github.event.issue.body, '@gemini') || contains(github.event.issue.title, '@gemini')))
       ))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      APP_ID: ${{ secrets.GEMINI_APP_ID }}
    steps:
      - uses: actions/checkout@v5

      # An identity of its own, when there is an app to lend one.
      #
      # Without this the run speaks as github-actions[bot], the same name
      # every other workflow in the repository uses — two agents commenting
      # on one issue are then indistinguishable. An app token also lifts two
      # limits of the built-in token: it may open pull requests regardless of
      # the repository setting, and what it opens actually starts the build
      # check. Events raised by GITHUB_TOKEN start no further workflow, so an
      # agent's pull request would otherwise arrive unvalidated.
      #
      # The secrets context reaches no if-condition, on the job or the step,
      # so the id moves into env first and the condition reads env. Until the
      # app exists, this step is skipped and everything below falls back to
      # the built-in token — the run keeps working, it just stays anonymous.
      - name: A token of its own
        id: app
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ secrets.GEMINI_APP_KEY }}

      # gh and git need an identity before they will commit or open a PR.
      - name: Identity for the bot
        run: |
          git config user.name  "Gemini Upkeep"
          git config user.email "gemini-upkeep@users.noreply.github.com"

      # Handing the token down through the step's own env is not enough:
      # run-gemini-cli is a composite action, and its inner steps carry env
      # blocks of their own. The first attempt did produce a valid app token
      # and the CLI still answered as github-actions[bot]. Writing it into
      # GITHUB_ENV makes it a real environment variable for every step that
      # follows, whatever they are built from. gh reads GH_TOKEN before
      # GITHUB_TOKEN, so this one wins.
      - name: Hand the token down
        if: steps.app.outputs.token != ''
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          echo "GH_TOKEN=$APP_TOKEN"     >> "$GITHUB_ENV"
          echo "GITHUB_TOKEN=$APP_TOKEN" >> "$GITHUB_ENV"

      - name: Research and propose
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          # A checkout is not a folder anyone clicked "trust" on, so the CLI
          # drops to its default approval mode and then refuses to run at all.
          # Interactive trust cannot be granted on a runner; the environment
          # variable is the documented way out for headless use.
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          workflow_name: weekly-upkeep
          # No tools.core restriction on purpose. Restricting means naming
          # every tool exactly right, and a typo removes a capability
          # silently. The safety here comes from the pull-request-only model
          # and the build check, not from a shortened tool list.
          settings: |-
            {
              "model": { "maxSessionTurns": 60 }
            }
          prompt: |
            You are the upkeep agent for this catalogue, running as a second
            opinion alongside a Claude-driven one. Read GEMINI.md first — it
            is the same file as CLAUDE.md and its rules bind you. Especially:
            never invent a fact or a link, never edit site/ by hand, never
            push to main, one topic per pull request.

            ${{ (github.event.inputs.focus || github.event.comment.body || github.event.issue.body) && format('The maintainer asked you to look at this specifically: {0}', (github.event.inputs.focus || github.event.comment.body || github.event.issue.body)) || '' }}

            ${{ github.event.issue.number && format('This reached you through issue #{0}. Do not comment on it yourself — whatever you answer here is posted to that thread for you, under this agent''s own name. So make your closing words the answer: what you did, or why you did not act, and the pull request if you opened one.', github.event.issue.number) || '' }}

            ## Pick exactly one thing

            ${{ (github.event.inputs.focus || github.event.comment.body || github.event.issue.body) && 'The instruction above overrides the priority list below.' || 'Work down this list and stop at the first item that yields real work:' }}

            1. **A dead or moved link.** Fetch the `links.home` of fact sheets
               in content/steckbrief.json. If one no longer resolves or now
               redirects elsewhere, that is the run's topic.

            2. **A stale price.** 42 entries carry a `plans` field, and those
               go out of date fastest. Check a handful against the vendor's
               current pricing page.

            3. **A declared gap.** content/arbeitsarten.json marks stations
               with a `luecke` field, each describing in one sentence what is
               missing. If a tool now exists that fills one, add its fact
               sheet and assign it.

            4. **Something genuinely new.** A model, harness or MCP server
               that has appeared since the catalogue was last touched.

            Before you start, look at the open pull requests with
            `gh pr list`. If the other agent already proposed the same thing
            this week, pick the next item instead. Two agents fixing the same
            link is wasted review time.

            If none of the four yields anything, that is a good outcome. Open
            no pull request. Say what you checked and stop.

            ## How to work

            Research with google_web_search and web_fetch. Prefer the
            vendor's own pages and repositories over write-ups about them.

            Change content/*.json only. Then run:

                python3 build/build.py

            It must exit 0. It validates before it writes, so a failure means
            you broke something — fix it before going further.

            Do NOT commit site/. Those files are not in git; the deploy
            workflow builds them.

            ## How to hand it over

            Create a branch named `upkeep-gemini/<short-topic>`, commit the source change, and open a pull request against main with `gh pr create`.

            Prefix the pull request title with `[Gemini]` so the maintainer
            can tell the two agents apart at a glance.

            The body must contain, for every claim you changed or added, the
            source URL it rests on. Also say plainly what you did NOT verify.
            A reviewer who has to guess what you checked cannot review.

      # The CLI will not speak under the app's name. A plain run step will —
      # the probe proved that much: its comment arrived as gemini-upkeep[bot]
      # while the model's own, in the same run, stayed github-actions[bot].
      # Setting GH_TOKEN and GITHUB_TOKEN through GITHUB_ENV changed nothing,
      # so the reply is posted here instead of inside the agent. It also means
      # the thread gets an answer even when the model forgets to write one.
      - name: Answer in the thread
        if: github.event.issue.number && steps.gemini.outputs.summary != ''
        env:
          SUMMARY: ${{ steps.gemini.outputs.summary }}
        run: gh issue comment ${{ github.event.issue.number }} --body "$SUMMARY"
