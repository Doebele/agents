# Two things in one workflow:
#
# 1. On every push it verifies that site/ still matches content/. That catches
#    the most common mistake — content edited, rebuild forgotten.
# 2. If the FTP credentials are present, the pages are then uploaded to
#    agents.medvesek.com. Without them only that step is skipped; the check
#    still runs.
#
# The secrets context is available in no if-condition — neither on the job nor
# on the step. So the value moves into env first and the condition reads env.
name: Check and deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'content/**'
      - 'build/**'
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.STRATO_FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify build is current
        run: python3 build/build.py --check

      # Strato speaks SFTP on port 22, not FTP on 21 — the host behind the
      # secret reverse-resolves to sshio.rzone.de.
      #
      # And its SSH account has no shell: it is SFTP only. Actions built on
      # scp fail here, because they run mkdir and tar on the far side. lftp
      # speaks the SFTP protocol itself and needs no remote commands.
      #
      # The secret names still say FTP; they carry the SFTP credentials.
      # The password travels through the environment, never on a command line.
      - name: Upload to Strato
        if: github.ref == 'refs/heads/main' && env.FTP_SERVER != ''
        env:
          FTP_HOST: ${{ secrets.STRATO_FTP_SERVER }}
          FTP_USER: ${{ secrets.STRATO_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.STRATO_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER" --env-password "sftp://$FTP_HOST" <<'EOF'
            set sftp:auto-confirm yes
            set net:max-retries 2
            mkdir -f agents
            cd agents
            put -O . site/index.html
            put -O . site/index.de.html
            put -O . site/.htaccess
            cls -l
            bye
          EOF
