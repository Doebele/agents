# Weekly upkeep.
#
# A reference work that promises "as of August 2026" needs someone to keep
# that promise. This is that someone. It runs Monday morning, picks ONE thing
# from the catalogue that has gone stale or is missing, researches it with
# sources, and opens a pull request.
#
# One thing per run is deliberate. A pull request touching forty fact sheets
# gets waved through rather than read, and then the review step is theatre.
#
# It never pushes to main. The maintainer merges from a phone, and merging
# deploys.
name: Weekly upkeep

on:
  schedule:
    # Mondays 06:20 UTC. Off the hour, because everyone schedules on the hour
    # and the runner queue is shorter a few minutes later.
    - cron: "20 6 * * 1"
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional: what to look at this run (leave empty to let it choose)"
        required: false
        type: string
      zugang:
        description: "api or abo, for this run alone (empty = repository variable CLAUDE_ZUGANG)"
        required: false
        type: string

jobs:
  upkeep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # Who pays: the Console balance or the subscription. See
      # .github/actions/claude-zugang, which also checks it before the run.
      - name: Who pays, and can it
        id: zugang
        uses: ./.github/actions/claude-zugang
        with:
          wahl: ${{ inputs.zugang }}
          variable: ${{ vars.CLAUDE_ZUGANG }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          modell: claude-opus-5

      - name: Research and propose
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Exactly one of the two, the other stays empty: with both set the
          # API key wins and the subscription never pays.
          anthropic_api_key: ${{ steps.zugang.outputs.zugang == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ steps.zugang.outputs.zugang == 'abo' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # Two failure modes met here. Pinning Bash to python3, git and gh
          # produced permission_denials_count 4 and no answer. Replacing the
          # whole list with bare Bash plus TodoWrite was worse: the run died
          # 300 ms after init, one turn, zero cost, no model call at all.
          # Bash(cmd:*) is the form that demonstrably works, so the list stays
          # in that form and simply covers the shell basics as well.
          claude_args: |
            --max-turns 150
            --allowedTools "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(python3:*),Bash(git:*),Bash(gh:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(find:*),Bash(mkdir:*),Bash(mv:*),Bash(rm:*),Bash(curl:*)"
          prompt: |
            You are the upkeep agent for this catalogue. Read CLAUDE.md first —
            its rules bind you, especially: never invent a fact or a link,
            never edit site/ by hand, never push to main, one topic per PR.

            ${{ github.event.inputs.focus && format('The maintainer asked you to look at this specifically: {0}', github.event.inputs.focus) || '' }}

            ## Pick exactly one thing

            ${{ github.event.inputs.focus && 'The instruction above overrides the priority list below.' || 'Work down this list and stop at the first item that yields real work:' }}

            1. **A dead or moved link.** Fetch the `links.home` of fact sheets
               in content/steckbrief.json. If one no longer resolves or now
               redirects elsewhere, that is the run's topic.

            2. **A declared gap.** Two places declare them, and CLAUDE.md says
               which under "What counts as a declared gap": the `luecke`
               fields in content/arbeitsarten.json, and the data gaps listed
               there. Read that section before you pick this item.

            3. **Something genuinely new.** A model, harness or MCP server
               that has appeared since the catalogue was last touched and that
               a beginner would plausibly meet.

            Prices are not on this list any more. The cross-check
            (.github/workflows/kreuzpruefung.yml) has them on Mondays and
            Thursdays: two agents read the same pages independently, a script
            compares the findings, a third decides. Leave them to it.

            If none of the three yields anything, that is a good outcome. Open
            no pull request. Say what you checked and stop.

            ## How to work

            Research with WebSearch and WebFetch. Prefer the vendor's own
            pages and repositories over write-ups about them.

            Change content/*.json only. Then run:

                python3 build/build.py

            It must exit 0. It validates before it writes, so a failure means
            you broke something — fix it before going further.

            Do NOT commit site/. Those files are not in git; the deploy
            workflow builds them.

            ## How to hand it over

            Create a branch named `upkeep/<short-topic>`, commit the source
            change, and open a pull request against main with `gh pr create`.

            The PR body must contain, for every claim you changed or added,
            the source URL it rests on. Also say plainly what you did NOT
            verify. A reviewer who has to guess what you checked cannot
            review.

            Title the PR in plain language: what changed, not "chore: update".

      - name: Aufwand erfassen
        if: always()
        uses: ./.github/actions/kosten
        with:
          agent: ${{ steps.zugang.outputs.zugang == 'abo' && 'claude-abo' || 'claude' }}
          execution: ${{ steps.claude.outputs.execution_file }}
