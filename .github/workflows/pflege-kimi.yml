# Weekly upkeep, third opinion.
#
# Same job as pflege.yml and pflege-gemini.yml, run by Kimi Code CLI.
# Saturdays, so the three spread across the week: Claude Monday, Gemini
# Thursday, Kimi Saturday.
#
# Two ways to order this one around beyond the schedule: the focus field of a
# manual run, and a Telegram message — the worker in telegram/ forwards it as
# repository_dispatch, which lands here and overrides the topic list.
#
# There is no ready-made action for this one, so the CLI is installed and
# called directly. Two things about it are worth knowing:
#
# 1. `kimi -p` runs a single prompt non-interactively and uses auto
#    permission mode by default. It cannot be combined with --yolo.
# 2. The CLI does NOT read the API key from the shell environment. It is
#    documented explicitly: "Running `export KIMI_API_KEY` in the terminal
#    does not give any provider its key". The key has to be written into
#    config.toml, which is what the setup step below does.
name: Weekly upkeep (Kimi)

on:
  schedule:
    # Saturdays 06:20 UTC.
    - cron: "20 6 * * 6"
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional: what to look at this run (leave empty to let it choose)"
        required: false
        type: string
  repository_dispatch:
    types: [telegram]

jobs:
  upkeep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # The deterministic half of the link check, so the model spends its
      # attention on judging, not on fetching: this writes
      # linkcheck-report.md, and the prompt below points at it. A 403 from a
      # bot-walled site is not a dead link — the report is input, not verdict.
      - name: Link report
        run: python3 build/linkcheck.py

      - name: Identity for the bot
        run: |
          git config user.name  "Kimi Upkeep"
          git config user.email "kimi-upkeep@users.noreply.github.com"

      # The vendor installs by piping a remote script into bash. That is one
      # more thing to trust on every run than a pinned action would be, and
      # it is worth being aware of rather than not noticing.
      - name: Install Kimi Code CLI
        run: |
          curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash
          # The installer reports "Installed to ~/.kimi-code/bin/kimi" and
          # appends that to .bashrc, which a non-login step never reads.
          echo "$HOME/.kimi-code/bin" >> "$GITHUB_PATH"
          # Fail here, not three steps later with "command not found", if the
          # installer ever moves.
          test -x "$HOME/.kimi-code/bin/kimi" || {
            echo "kimi binary not where expected; installer output above"; exit 1; }

      # Two earlier attempts failed here, so this step is deliberately loud.
      #
      # First "No model configured": writing only api_key is not enough, the
      # CLI wants a provider, a model alias, default_model and a positive
      # max_context_size.
      #
      # Then the model came out empty, because `python3 … | tee` reports
      # tee's exit status and swallowed the failure. Hence pipefail and the
      # raw response in the log.
      #
      # Two endpoints are documented: the Platform API and the managed Kimi
      # Code service. Rather than assume which kind of key this is, both are
      # probed and the one that answers wins.
      - name: Credentials and model into config.toml
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_MODEL: ${{ vars.KIMI_MODEL }}
        run: |
          set -euo pipefail
          test -n "$KIMI_API_KEY" || { echo "KIMI_API_KEY is not set"; exit 1; }

          BASE=""
          # .cn is the third documented home: a key from the Chinese account
          # is rejected by the international endpoint and the other way round.
          for url in https://api.moonshot.ai/v1 https://api.kimi.com/coding/v1 https://api.moonshot.cn/v1; do
            echo "--- probing $url/models"
            code=$(curl -sS -o /tmp/models.json -w '%{http_code}' \
                   -H "Authorization: Bearer $KIMI_API_KEY" "$url/models" || echo 000)
            echo "    HTTP $code"
            head -c 300 /tmp/models.json; echo
            if [ "$code" = "200" ]; then BASE="$url"; break; fi
          done
          test -n "$BASE" || { echo "Neither endpoint accepted the key."; exit 1; }
          echo "Using endpoint: $BASE"

          MODEL=$(python3 -c '
          import json, os, sys
          ids = [m["id"] for m in json.load(open("/tmp/models.json"))["data"]]
          print("Available:", ", ".join(ids), file=sys.stderr)
          want = os.environ.get("KIMI_MODEL") or ""
          if want:
              if want not in ids:
                  sys.exit(f"KIMI_MODEL={want} is not in the list")
              print(want)
          else:
              print(sorted([i for i in ids if "k3" in i.lower()] or ids)[0])
          ')
          test -n "$MODEL" || { echo "No model could be chosen."; exit 1; }
          echo "Using model: $MODEL"

          mkdir -p "$HOME/.kimi-code"
          cat > "$HOME/.kimi-code/config.toml" <<TOML
          default_model = "upkeep"
          default_permission_mode = "auto"
          telemetry = false

          [providers.kimi]
          type = "kimi"
          base_url = "$BASE"
          api_key = "$KIMI_API_KEY"

          [models.upkeep]
          provider = "kimi"
          model = "$MODEL"
          max_context_size = 262144
          TOML
          chmod 600 "$HOME/.kimi-code/config.toml"
          kimi --version

      - name: Research and propose
        run: |
          kimi -p "$(cat <<'PROMPT'
          You are the upkeep agent for this catalogue, running as a third
          opinion alongside a Claude-driven and a Gemini-driven one. Read
          AGENTS.md first — it is the same file as CLAUDE.md and its rules
          bind you. Especially: never invent a fact or a link, never edit
          site/ by hand, never push to main, one topic per pull request.

          Pick exactly one thing. Work down this list and stop at the first
          item that yields real work:

          1. A dead or moved link. linkcheck-report.md in the repo root was
             just written by build/linkcheck.py — work through what it lists,
             and re-check by hand before changing anything: a 403 from a
             bot-walled site is not a dead link.
          2. A declared gap. Two places declare them, and AGENTS.md says which
             under "What counts as a declared gap": the `luecke` fields in
             content/arbeitsarten.json, and the data gaps listed there. Read
             that section before you pick this item.
          3. Something genuinely new that a beginner would plausibly meet.

          Before you start, run `gh pr list`. If another agent already
          proposed the same thing this week, pick the next item instead.

          Prices are not on this list any more. The cross-check
          (.github/workflows/kreuzpruefung.yml) has them on Mondays and
          Thursdays: two agents read the same pages independently, a script
          compares the findings, a third decides. Leave them to it.

          If none of the three yields anything, that is a good outcome. Open
          no pull request. Say what you checked and stop.

          Change content/*.json only, then run `python3 build/build.py`. It
          must exit 0; it validates before it writes. Do NOT commit site/ —
          those files are not in git, the deploy workflow builds them.

          Create a branch named `upkeep-kimi/<short-topic>`, commit the
          source change, and open a pull request against main with
          `gh pr create`. Prefix the title with [Kimi].

          The body must contain, for every claim you changed or added, the
          source URL it rests on. Also say plainly what you did NOT verify.
          PROMPT
          )${{ (github.event.inputs.focus || github.event.client_payload.task) && format('

          The maintainer asked you to look at this specifically, which overrides the list above: {0}', (github.event.inputs.focus || github.event.client_payload.task)) || '' }}"
