# Zwei Dinge in einem Ablauf:
#
# 1. Bei jedem Push wird geprueft, ob site/ noch zu content/ passt. Das faengt
#    den haeufigsten Fehler ab — Inhalt geaendert, neu bauen vergessen.
# 2. Sind die FTP-Zugangsdaten hinterlegt, werden die Seiten danach nach
#    agents.medvesek.com geladen. Fehlen sie, wird nur dieser Schritt
#    uebersprungen; die Pruefung laeuft trotzdem.
#
# Der secrets-Kontext ist in keiner if-Bedingung verfuegbar — weder am Job
# noch am Schritt. Deshalb wandert der Wert zuerst nach env, und die
# Bedingung fragt env ab.
name: Pruefen und ausliefern

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'content/**'
      - 'build/**'
  pull_request:
  workflow_dispatch:

jobs:
  ausliefern:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.STRATO_FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - name: Bauweg pruefen
        run: python3 build/build.py --pruefen

      - name: Hochladen
        if: github.ref == 'refs/heads/main' && env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.STRATO_FTP_SERVER }}
          username: ${{ secrets.STRATO_FTP_USER }}
          password: ${{ secrets.STRATO_FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: /agents/
          exclude: |
            **/node_modules/**
            **/package*.json
            **/README.md
            **/test_*.js
