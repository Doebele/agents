# Was die Agenten kosten.
#
# Sechs Laeufe, drei Harnesses, drei Anbieter, und bis hierher keine Zahl, die
# man vergleichen koennte. Dieser Lauf sammelt sie einmal die Woche ein.
#
# Zwei Ebenen, weil eine nicht reicht. Die Zeilen aus den Laeufen selbst sind
# sofort da und je Lauf zugeordnet, aber ihre Kostenangabe ist eine Schaetzung
# des Clients — und fuer die Kimi-CLI gibt es sie gar nicht. Die Admin-API von
# Anthropic sagt, was tatsaechlich abgerechnet wurde, dafuer nur tageweise.
# Zusammen ergeben sie ein Bild, einzeln keins.
#
# Alles landet auf einem eigenen Zweig `metriken`, nicht auf main: der
# Maintainer liest Diffs auf dem Telefon, und woechentliche Zahlenzeilen
# zwischen den Steckbrief-Aenderungen machen genau das kaputt.
name: Kosten

on:
  schedule:
    # Sonntags 07:00 UTC, wenn die Woche vorbei ist.
    - cron: "0 7 * * 0"
  workflow_dispatch:
    inputs:
      tage:
        description: "Wie viele Tage einsammeln (Standard 8)"
        required: false
        default: "8"
        type: string
      issue:
        description: "Den Wochenbericht auch als Issue anlegen (sonntags geschieht das immer)"
        required: false
        default: false
        type: boolean

jobs:
  sammeln:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      # Fuer den Wochenbericht: Pull Requests lesen, ein Issue anlegen.
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Auf den Zweig metriken wechseln
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Das Skript ueberlebt den Zweigwechsel nicht, also vorher zur Seite.
          cp build/kosten.py /tmp/kosten.py
          cp build/wochenbericht.py /tmp/wochenbericht.py

          git config user.name  "Kostenerfassung"
          git config user.email "kosten@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin metriken >/dev/null 2>&1; then
            git fetch origin metriken
            git checkout -B metriken origin/metriken
          else
            # Beim ersten Lauf gibt es den Zweig noch nicht. Ohne Historie
            # angelegt: hier stehen Zahlen, keine Katalogfassung.
            echo "Zweig metriken existiert noch nicht — wird angelegt."
            git checkout --orphan metriken
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          mkdir -p metriken

      - name: Zeilen der letzten Laeufe einsammeln
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGE: ${{ github.event.inputs.tage || '8' }}
        run: |
          set -uo pipefail
          case "$TAGE" in ''|*[!0-9]*) echo "tage muss eine Zahl sein: $TAGE"; exit 1 ;; esac
          python3 /tmp/kosten.py sammeln --tage "$TAGE" --out metriken/laeufe.csv

      # Ohne Admin-Schluessel bleibt es bei den Schaetzungen aus den Laeufen.
      # Das Skript sagt das und laeuft weiter — ein fehlendes Secret ist kein
      # Grund, den Lauf scheitern zu lassen.
      - name: Was die Abrechnung sagt
        env:
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
        run: python3 /tmp/kosten.py anthropic --tage 31

      - name: Auszaehlen und ablegen
        run: |
          set -uo pipefail
          { echo "## Aufwand nach Monat, Lauf und Agent"; echo; \
            python3 /tmp/kosten.py bericht metriken/laeufe.csv; } \
            | tee -a "$GITHUB_STEP_SUMMARY"

          # -f, weil main den Ordner in .gitignore fuehrt, damit er dort nie
          # landet; auf dem Zweig metriken liegt die Datei vom Checkout noch
          # im Arbeitsverzeichnis. Ohne -f scheiterte hier der erste Lauf.
          git add -f metriken
          if git diff --cached --quiet; then
            echo "Nichts Neues."
            exit 0
          fi
          git commit -m "Kosten: Stand $(date -u +%Y-%m-%d)"
          for versuch in 1 2 3 4; do
            git push origin metriken && break
            echo "Push fehlgeschlagen, Versuch $versuch"
            sleep $((2 ** versuch))
            git fetch origin metriken && git rebase origin/metriken || true
          done

      # Der Bericht der Woche als Issue. GitHub schickt dazu eine Mail, wenn
      # die Benachrichtigungen fuer das Repository an sind — ein eigener
      # Mailzugang mit Passwort im Repository waere eine Sache mehr, die
      # auslaufen oder durchsickern kann. Der Bericht der Vorwoche wird dabei
      # geschlossen, damit nur der aktuelle offen steht. Auch wenn ein Schritt
      # davor gescheitert ist: dann steht das im Bericht.
      - name: Wochenbericht als Issue
        if: always() && (github.event_name == 'schedule' || inputs.issue)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 /tmp/wochenbericht.py --kosten metriken/laeufe.csv --out /tmp/bericht.md > /dev/null
          cat /tmp/bericht.md >> "$GITHUB_STEP_SUMMARY"
          gh label create wochenbericht --repo "$GITHUB_REPOSITORY" --color 0e8a16 \
            --description "Automatischer Bericht der Woche" --force > /dev/null
          for alt in $(gh issue list --repo "$GITHUB_REPOSITORY" --label wochenbericht \
                         --state open --json number --jq '.[].number'); do
            gh issue close "$alt" --repo "$GITHUB_REPOSITORY" --reason completed > /dev/null
          done
          gh issue create --repo "$GITHUB_REPOSITORY" --label wochenbericht \
            --title "Wochenbericht KW $(date -u +%V)/$(date -u +%G)" --body-file /tmp/bericht.md
