# Kreuzpruefung der Preise.
#
# Preise sind das, was am schnellsten falsch wird, und ein falscher Preis ist
# schlimmer als ein fehlender: der Leser plant damit. Ein einzelner Agent, der
# eine Anbieterseite liest, ist an genau dieser Stelle die duennste Stelle im
# Ablauf — niemand prueft ihn nach.
#
# Also lesen zwei. Kimi und GLM bekommen dieselbe Liste, arbeiten unabhaengig
# voneinander und schreiben ihren Befund in ein festes Schema. Ein Skript stellt
# die beiden gegenueber, bevor ein Modell sie zu Gesicht bekommt. Claude
# entscheidet nur noch, was strittig ist, und oeffnet den Pull Request.
#
# Montags und donnerstags. Seit es diesen
# Lauf gibt, nehmen die Pflegelaeufe die Preise nicht mehr selbst — sonst
# pruefen zwei Agenten am selben Morgen dieselbe Seite.
#
# Wie alles hier: nur Pull Requests, kein Push auf main.
name: Kreuzpruefung (Preise)

on:
  schedule:
    # Montag und Donnerstag 05:20 UTC.
    - cron: "20 5 * * 1"
    - cron: "20 5 * * 4"
  workflow_dispatch:
    inputs:
      anzahl:
        description: "Wie viele Steckbriefe prüfen (Standard 30)"
        required: false
        default: "30"
        type: string
      zugang:
        description: "api oder abo, nur für diesen Lauf (leer = Repository-Variable CLAUDE_ZUGANG)"
        required: false
        type: string

jobs:
  # ------------------------------------------------------------------ Auftrag
  # Beide Rechercheure muessen dieselbe Liste bekommen, sonst gibt es nichts zu
  # vergleichen. Deshalb waehlt ein Skript sie aus, nicht die Modelle.
  auftrag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Die aeltesten Preisstaende waehlen
        # Die Zahl kommt aus einem Feld, das der Maintainer ausfuellt. Sie
        # wandert per Umgebungsvariable in den Schritt und wird geprueft, statt
        # in die Kommandozeile interpoliert zu werden.
        env:
          ANZAHL: ${{ github.event.inputs.anzahl || '30' }}
        run: |
          set -euo pipefail
          case "$ANZAHL" in
            ''|*[!0-9]*) echo "anzahl muss eine Zahl sein, war: $ANZAHL"; exit 1 ;;
          esac
          python3 build/kreuzpruefung.py auftrag --anzahl "$ANZAHL" | tee /tmp/auftrag.txt
          { echo "## Auftrag"; echo; echo '```'; cat /tmp/auftrag.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: auftrag
          path: auftrag.json

  # ------------------------------------------------------------------ Kimi
  # Seit Oktober liest Kimi statt Gemini, ueber das Kimi-Code-Abo statt ueber
  # einen Gemini-API-Schluessel. Gleiche CLI wie der Z.AI-Rechercheur unten,
  # nur mit dem eigenen Anbieter dahinter: zwei verschiedene Modelle lesen
  # dieselbe Seite, darauf kommt es an, nicht auf zwei verschiedene Programme.
  kimi:
    needs: auftrag
    runs-on: ubuntu-latest
    # Liest und schreibt eine Datei, sonst nichts. Kein Schreibrecht, kein
    # App-Token: dieser Job soll nichts committen und nichts oeffnen koennen.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: auftrag

      - name: Kimi Code CLI installieren
        run: |
          curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash
          echo "$HOME/.kimi-code/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.kimi-code/bin/kimi" || {
            echo "kimi binary nicht am erwarteten Ort; Ausgabe des Installers oben"; exit 1; }

      # Ein Abo-Schluessel antwortet nur auf einer der beiden Coding-Adressen
      # der Mitgliedschaft; welche, sagt die Sondierung. Ein Schluessel der
      # Entwicklerplattform (moonshot.cn) wird bewusst nicht mehr probiert:
      # dessen leeres Guthaben hat Kimi von August bis September stillgelegt.
      - name: Zugang und Modell in die config.toml
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_MODEL: ${{ vars.KIMI_MODEL }}
        run: |
          set -euo pipefail
          test -n "$KIMI_API_KEY" || { echo "KIMI_API_KEY ist nicht gesetzt"; exit 1; }
          BASE=""
          for url in https://api.kimi.ai/coding/v1 https://api.kimi.com/coding/v1; do
            code=$(curl -sS -o /tmp/models.json -w '%{http_code}' \
                   -H "Authorization: Bearer $KIMI_API_KEY" "$url/models" || echo 000)
            echo "  GET $url/models -> HTTP $code"
            if [ "$code" = "200" ]; then BASE="$url"; break; fi
            head -c 200 /tmp/models.json; echo
          done
          test -n "$BASE" || { echo "Keine Coding-Adresse nimmt den Schlüssel. Stammt er aus kimi.ai/code?"; exit 1; }
          MODEL=$(python3 -c '
          import json, os, sys
          ids = [m["id"] for m in json.load(open("/tmp/models.json"))["data"]]
          print("Verfuegbar:", ", ".join(ids), file=sys.stderr)
          want = os.environ.get("KIMI_MODEL") or ""
          if want and want not in ids:
              sys.exit(f"KIMI_MODEL={want} steht nicht in der Liste")
          print(want or ("k3" if "k3" in ids else ids[0]))
          ')
          echo "Adresse: $BASE · Modell: $MODEL"
          mkdir -p "$HOME/.kimi-code"
          cat > "$HOME/.kimi-code/config.toml" <<TOML
          default_model = "kreuzpruefung"
          default_permission_mode = "auto"
          telemetry = false

          [providers.kimi]
          type = "kimi"
          base_url = "$BASE"
          api_key = "$KIMI_API_KEY"

          [models.kreuzpruefung]
          provider = "kimi"
          model = "$MODEL"
          max_context_size = 262144
          TOML
          chmod 600 "$HOME/.kimi-code/config.toml"
          kimi --version

      # Die Kimi-CLI gibt ihren Verbrauch nicht heraus, also bleibt die Laufzeit.
      - name: Startzeit merken
        run: echo "KOSTEN_START=$(date +%s)" >> "$GITHUB_ENV"

      # Die Grenze sitzt am Schritt, nicht am Job: "Befund sichern" und das
      # Hochladen laufen danach trotzdem, und was bis dahin in der Datei steht,
      # geht an die Entscheidung. Ohne Grenze wartet die bis zu sechs Stunden
      # auf einen haengenden Lauf.
      - name: Preise lesen
        timeout-minutes: 45
        run: |
          kimi -p "$(sed 's/{AGENT}/kimi/g' build/kreuzpruefung-recherche.md)"

      - name: Befund sichern
        if: always()
        run: |
          test -f befund-kimi.json \
            && echo "befund-kimi.json: $(wc -c < befund-kimi.json) Bytes" \
            || echo "kein Befund abgeliefert"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: befund-kimi
          path: befund-kimi.json
          if-no-files-found: warn

      - name: Aufwand erfassen
        if: always()
        uses: ./.github/actions/kosten
        with:
          agent: kimi
          start: ${{ env.KOSTEN_START }}

  # ------------------------------------------------------------------ Z.AI
  # Gleicher Aufbau wie pflege-zai.yml: GLM kommt ueber die Kimi-CLI herein,
  # weil ZCode selbst keinen Kommandozeilenbetrieb kennt.
  zai:
    needs: auftrag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: auftrag

      # Der Anbieter installiert, indem er ein entferntes Skript in bash pipet.
      # Das ist bei jedem Lauf eine Sache mehr, der man vertraut, als es eine
      # gepinnte Action waere — besser bewusst als unbemerkt.
      - name: Kimi Code CLI installieren
        run: |
          curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash
          echo "$HOME/.kimi-code/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.kimi-code/bin/kimi" || {
            echo "kimi binary nicht am erwarteten Ort; Ausgabe des Installers oben"; exit 1; }

      - name: Zugang und Modell in die config.toml
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: ${{ vars.ZAI_MODEL }}
        run: |
          set -euo pipefail
          test -n "$ZAI_API_KEY" || { echo "ZAI_API_KEY ist nicht gesetzt"; exit 1; }

          # Welche Tuer der Schluessel oeffnet, wird nicht vorausgesetzt:
          # build/zai_zugang.py probiert erst den Endpunkt des Coding-Abos, dann
          # den je Token abgerechneten, und sagt, aus welchem Topf bezahlt wird.
          # Frueher stand hier fest /api/paas/v4, die Guthaben-Tuer — ein Abo,
          # wo es eines gibt, wurde nie gefragt, und als das Guthaben leer war,
          # starb jeder Lauf an Code 1113. Dieselbe Datei wie in pflege-zai.yml, damit die beiden
          # nicht auseinanderlaufen.
          #
          # Nicht eval "$(…)": unter set -e fiele ein Fehler darin nicht auf.
          ZUGANG=$(python3 build/zai_zugang.py)
          eval "$ZUGANG"
          echo "Modell: $ZAI_MODELL ($ZAI_TOPF)"

          mkdir -p "$HOME/.kimi-code"
          cat > "$HOME/.kimi-code/config.toml" <<TOML
          default_model = "kreuzpruefung"
          default_permission_mode = "auto"
          telemetry = false

          [providers.zai]
          type = "openai"
          base_url = "$ZAI_BASE"
          api_key = "$ZAI_API_KEY"

          [models.kreuzpruefung]
          provider = "zai"
          model = "$ZAI_MODELL"
          max_context_size = 131072
          TOML
          chmod 600 "$HOME/.kimi-code/config.toml"
          kimi --version

      # Die Kimi-CLI gibt ihren Verbrauch nicht heraus, also bleibt die Laufzeit.
      - name: Startzeit merken
        run: echo "KOSTEN_START=$(date +%s)" >> "$GITHUB_ENV"

      # Grenze wie bei Kimi, aus demselben Grund. Der Auftrag ist fuer beide
      # derselbe und liegt in einer Datei: zwei Abschriften liefen beim
      # ersten Nachbessern auseinander, und dann laesen die beiden nach
      # verschiedenen Regeln, ohne dass es auffaellt.
      - name: Preise lesen
        timeout-minutes: 45
        run: |
          kimi -p "$(sed 's/{AGENT}/zai/g' build/kreuzpruefung-recherche.md)"

      - name: Befund sichern
        if: always()
        run: |
          test -f befund-zai.json \
            && echo "befund-zai.json: $(wc -c < befund-zai.json) Bytes" \
            || echo "kein Befund abgeliefert"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: befund-zai
          path: befund-zai.json
          if-no-files-found: warn

      - name: Aufwand erfassen
        if: always()
        uses: ./.github/actions/kosten
        with:
          agent: zai
          start: ${{ env.KOSTEN_START }}

  # ------------------------------------------------------------------ Urteil
  entscheidung:
    needs: [auftrag, kimi, zai]
    # Auch wenn einer der beiden Rechercheure gescheitert ist. Ein einzelner
    # Befund gilt dann als ungeprueft — der Entscheider schlaegt ihn selbst
    # nach. Das ist immer noch besser als ein Lauf, der nichts liefert.
    if: always() && needs.auftrag.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    # Claude entscheidet. Bis Oktober konnte es auch Kimi, ueber die Variable
    # KREUZPRUEFUNG_ENTSCHEIDER; seit Kimi selbst Preise liest, waere es dann
    # Richter in eigener Sache. Die Variable wird nicht mehr gelesen.
    env:
      ENTSCHEIDER: claude
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: auftrag

      # Ein fehlender Befund darf den Lauf nicht abbrechen, deshalb einzeln und
      # nachsichtig heruntergeladen.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: befund-kimi
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: befund-zai

      # Wer die alte Variable noch auf kimi stehen hat, soll erfahren, dass
      # sie nichts mehr bewirkt, statt sich ueber Claudes Urteil zu wundern.
      - name: Alte Entscheider-Variable
        if: vars.KREUZPRUEFUNG_ENTSCHEIDER != '' && vars.KREUZPRUEFUNG_ENTSCHEIDER != 'claude'
        run: |
          echo "::warning::KREUZPRUEFUNG_ENTSCHEIDER steht auf '${{ vars.KREUZPRUEFUNG_ENTSCHEIDER }}' und wird nicht mehr gelesen. Kimi liest jetzt selbst Preise; es entscheidet Claude. Die Variable kann geloescht werden."

      - name: Befunde gegenueberstellen
        run: |
          python3 build/kreuzpruefung.py vergleich befund-kimi.json befund-zai.json
          { echo "## Vergleich"; echo; sed -n '1,40p' vergleich.md; } >> "$GITHUB_STEP_SUMMARY"

      # Der Auftrag liegt in einer eigenen Datei, mit dem Namen des
      # Entscheiders fuer Zweig, Titel und Bilanzzeilen.
      - name: Auftrag einlesen
        id: auftrag
        run: |
          {
            echo "text<<ENDE_DES_AUFTRAGS"
            sed "s/{ENTSCHEIDER}/$ENTSCHEIDER/g" build/kreuzpruefung-entscheidung.md
            echo "ENDE_DES_AUFTRAGS"
          } >> "$GITHUB_OUTPUT"

      # Wer zahlt: API-Guthaben oder Abo. Siehe .github/actions/claude-zugang.
      - name: Wer zahlt, und geht es (Claude)
        id: zugang
        uses: ./.github/actions/claude-zugang
        with:
          wahl: ${{ inputs.zugang }}
          variable: ${{ vars.CLAUDE_ZUGANG }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          modell: claude-sonnet-5-5

      - name: Entscheiden und vorschlagen (Claude)
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Genau einer von beiden, der andere bleibt leer: Sind beide
          # gesetzt, gewinnt der API-Schluessel, und das Abo zahlt nie.
          anthropic_api_key: ${{ steps.zugang.outputs.zugang == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ steps.zugang.outputs.zugang == 'abo' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 200
            --allowedTools "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(python3:*),Bash(git:*),Bash(gh:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(find:*),Bash(mkdir:*),Bash(mv:*),Bash(rm:*),Bash(curl:*)"
          prompt: ${{ steps.auftrag.outputs.text }}

      - name: Aufwand erfassen
        if: always()
        uses: ./.github/actions/kosten
        with:
          agent: ${{ steps.zugang.outputs.zugang == 'abo' && 'claude-abo' || 'claude' }}
          execution: ${{ steps.claude.outputs.execution_file }}
